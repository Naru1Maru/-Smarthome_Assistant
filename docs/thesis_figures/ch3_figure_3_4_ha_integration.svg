<svg xmlns="http://www.w3.org/2000/svg" width="1460" height="760" viewBox="0 0 1460 760">
  <defs>
    <style>
      .label { font: 600 21px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .small { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .box { fill: #fff; stroke: #111; stroke-width: 2.5; rx: 18; ry: 18; }
      .line { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #111; stroke-width: 2.2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1420" height="720" fill="#fff" stroke="#111" stroke-width="2"/>

  <rect class="box" x="80" y="130" width="260" height="140"/>
  <text x="210" y="180" text-anchor="middle" class="label">ValidatedCommand</text>
  <text x="210" y="215" text-anchor="middle" class="small">intent, target, params</text>

  <rect class="box" x="80" y="430" width="260" height="140"/>
  <text x="210" y="480" text-anchor="middle" class="label">Validated Scenario</text>
  <text x="210" y="515" text-anchor="middle" class="small">rules, triggers, actions</text>

  <rect class="box" x="450" y="100" width="300" height="190"/>
  <text x="600" y="150" text-anchor="middle" class="label">Gateway</text>
  <text x="600" y="185" text-anchor="middle" class="small">валидация и разрешение</text>
  <text x="600" y="215" text-anchor="middle" class="small">entity_id</text>
  <text x="600" y="245" text-anchor="middle" class="small">формирование сервисного вызова</text>

  <rect class="box" x="450" y="410" width="300" height="180"/>
  <text x="600" y="450" text-anchor="middle" class="label">Компилятор</text>
  <text x="600" y="485" text-anchor="middle" class="small">в формат автоматизаций</text>
  <text x="600" y="515" text-anchor="middle" class="small">Home Assistant</text>

  <rect class="box" x="860" y="130" width="250" height="140"/>
  <text x="985" y="180" text-anchor="middle" class="label">REST API Home Assistant</text>
  <text x="985" y="215" text-anchor="middle" class="small">/api/services/light/*</text>

  <rect class="box" x="860" y="430" width="250" height="140"/>
  <text x="985" y="470" text-anchor="middle" class="label">Файл автоматизаций</text>
  <text x="985" y="500" text-anchor="middle" class="small">Home Assistant</text>
  <text x="985" y="527" text-anchor="middle" class="small">сценарии gateway</text>

  <rect class="box" x="1210" y="130" width="180" height="140"/>
  <text x="1300" y="180" text-anchor="middle" class="label">Сервис</text>
  <text x="1300" y="215" text-anchor="middle" class="small">light.turn_on /</text>
  <text x="1300" y="242" text-anchor="middle" class="small">light.turn_off</text>

  <rect class="box" x="1210" y="430" width="180" height="140"/>
  <text x="1300" y="470" text-anchor="middle" class="label">Перезагрузка</text>
  <text x="1300" y="500" text-anchor="middle" class="small">автоматизаций</text>
  <text x="1300" y="527" text-anchor="middle" class="small">активация сценария</text>

  <line class="line" x1="340" y1="200" x2="450" y2="200"/>
  <line class="line" x1="340" y1="500" x2="450" y2="500"/>
  <line class="line" x1="750" y1="200" x2="860" y2="200"/>
  <line class="line" x1="750" y1="500" x2="860" y2="500"/>
  <line class="line" x1="1110" y1="200" x2="1210" y2="200"/>
  <line class="line" x1="1110" y1="500" x2="1210" y2="500"/>
  <line class="dash" x1="600" y1="290" x2="600" y2="410"/>
  <rect x="640" y="332" width="210" height="46" fill="#fff"/>
  <text x="745" y="352" text-anchor="middle" class="small">LLM используется только</text>
  <text x="745" y="374" text-anchor="middle" class="small">для интерпретации текста</text>
</svg>
