<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="620" viewBox="0 0 1500 620">
  <defs>
    <style>
      .label { font: 600 21px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .small { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .box { fill: #fff; stroke: #111; stroke-width: 2.5; rx: 18; ry: 18; }
      .line { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1460" height="580" fill="#fff" stroke="#111" stroke-width="2"/>

  <rect class="box" x="70" y="180" width="200" height="110"/>
  <text x="170" y="225" text-anchor="middle" class="label">Текст сценария</text>
  <text x="170" y="257" text-anchor="middle" class="small">естественный язык</text>

  <rect class="box" x="340" y="180" width="210" height="110"/>
  <text x="445" y="225" text-anchor="middle" class="label">Сценарный LLM</text>
  <text x="445" y="257" text-anchor="middle" class="small">prompt + контекст дома</text>

  <rect class="box" x="620" y="180" width="220" height="110"/>
  <text x="730" y="225" text-anchor="middle" class="label">ScenarioBundle</text>
  <text x="730" y="257" text-anchor="middle" class="small">промежуточная структура</text>

  <rect class="box" x="910" y="180" width="220" height="110"/>
  <text x="1020" y="215" text-anchor="middle" class="label">Нормализация</text>
  <text x="1020" y="245" text-anchor="middle" class="small">канонизация комнат</text>
  <text x="1020" y="272" text-anchor="middle" class="small">удаление дублей</text>

  <rect class="box" x="1200" y="180" width="220" height="110"/>
  <text x="1310" y="215" text-anchor="middle" class="label">Валидация</text>
  <text x="1310" y="245" text-anchor="middle" class="small">проверка триггеров</text>
  <text x="1310" y="272" text-anchor="middle" class="small">и действий</text>

  <rect class="box" x="505" y="410" width="250" height="110"/>
  <text x="630" y="445" text-anchor="middle" class="label">Компиляция</text>
  <text x="630" y="475" text-anchor="middle" class="small">в формат автоматизаций</text>
  <text x="630" y="502" text-anchor="middle" class="small">Home Assistant</text>

  <rect class="box" x="840" y="410" width="250" height="110"/>
  <text x="965" y="445" text-anchor="middle" class="label">Предпросмотр</text>
  <text x="965" y="475" text-anchor="middle" class="small">сохранение, обновление,</text>
  <text x="965" y="502" text-anchor="middle" class="small">удаление</text>

  <line class="line" x1="270" y1="235" x2="340" y2="235"/>
  <line class="line" x1="550" y1="235" x2="620" y2="235"/>
  <line class="line" x1="840" y1="235" x2="910" y2="235"/>
  <line class="line" x1="1130" y1="235" x2="1200" y2="235"/>
  <line class="line" x1="1310" y1="290" x2="965" y2="410"/>
  <line class="line" x1="730" y1="290" x2="630" y2="410"/>
  <line class="line" x1="755" y1="465" x2="840" y2="465"/>
</svg>
