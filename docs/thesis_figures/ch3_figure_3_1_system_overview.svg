<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="760" viewBox="0 0 1400 760">
  <defs>
    <style>
      .label { font: 600 22px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .small { font: 400 18px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .box { fill: #fff; stroke: #111; stroke-width: 2.5; rx: 18; ry: 18; }
      .line { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .dash { stroke: #111; stroke-width: 2.2; fill: none; stroke-dasharray: 8 8; marker-end: url(#arrow); }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1360" height="720" fill="#fff" stroke="#111" stroke-width="2"/>

  <rect class="box" x="80" y="150" width="250" height="180"/>
  <text x="205" y="205" text-anchor="middle" class="label">Android-приложение</text>
  <text x="205" y="245" text-anchor="middle" class="small">текстовый ввод</text>
  <text x="205" y="275" text-anchor="middle" class="small">голосовой ввод</text>
  <text x="205" y="305" text-anchor="middle" class="small">быстрые действия</text>

  <rect class="box" x="410" y="150" width="270" height="180"/>
  <text x="545" y="205" text-anchor="middle" class="label">Gateway / FastAPI</text>
  <text x="545" y="245" text-anchor="middle" class="small">HTTP API</text>
  <text x="545" y="275" text-anchor="middle" class="small">маршрутизация запросов</text>
  <text x="545" y="305" text-anchor="middle" class="small">логирование и dry-run</text>

  <rect class="box" x="760" y="110" width="280" height="120"/>
  <text x="900" y="160" text-anchor="middle" class="label">Модуль интерпретации</text>
  <text x="900" y="195" text-anchor="middle" class="small">rules / llm / llm_safe</text>

  <rect class="box" x="760" y="280" width="280" height="120"/>
  <text x="900" y="330" text-anchor="middle" class="label">Валидация</text>
  <text x="900" y="365" text-anchor="middle" class="small">проверка цели и параметров</text>

  <rect class="box" x="1110" y="150" width="220" height="180"/>
  <text x="1220" y="205" text-anchor="middle" class="label">Home Assistant</text>
  <text x="1220" y="245" text-anchor="middle" class="small">REST API</text>
  <text x="1220" y="275" text-anchor="middle" class="small">automation</text>
  <text x="1220" y="305" text-anchor="middle" class="small">выполнение команд</text>

  <rect class="box" x="1110" y="460" width="220" height="120"/>
  <text x="1220" y="510" text-anchor="middle" class="label">IoT-устройства</text>
  <text x="1220" y="545" text-anchor="middle" class="small">лампы, розетки, датчики</text>

  <rect class="box" x="420" y="460" width="260" height="120"/>
  <text x="550" y="510" text-anchor="middle" class="label">Локальный LLM-мост</text>
  <text x="550" y="545" text-anchor="middle" class="small">OpenAI-совместимый API</text>

  <line class="line" x1="330" y1="240" x2="410" y2="240"/>
  <line class="line" x1="680" y1="240" x2="760" y2="170"/>
  <line class="line" x1="900" y1="230" x2="900" y2="280"/>
  <line class="line" x1="1040" y1="240" x2="1110" y2="240"/>
  <line class="line" x1="1220" y1="330" x2="1220" y2="460"/>
  <path class="dash" d="M640 330 L640 430 L550 430 L550 460"/>
  <path class="dash" d="M680 500 L720 500 L720 170 L760 170"/>

  <rect x="338" y="205" width="64" height="24" fill="#fff"/>
  <text x="370" y="223" text-anchor="middle" class="small">HTTP</text>
  <rect x="688" y="130" width="76" height="24" fill="#fff"/>
  <text x="726" y="148" text-anchor="middle" class="small">команды</text>
  <rect x="1042" y="205" width="96" height="24" fill="#fff"/>
  <text x="1090" y="223" text-anchor="middle" class="small">service call</text>
  <rect x="504" y="398" width="112" height="24" fill="#fff"/>
  <text x="560" y="416" text-anchor="middle" class="small">LLM-запросы</text>
</svg>
