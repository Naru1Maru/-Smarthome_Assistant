<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760">
  <defs>
    <style>
      .box { fill: #ffffff; stroke: #111111; stroke-width: 2; }
      .text { font-family: "Times New Roman", serif; font-size: 24px; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
      .small { font-family: "Times New Roman", serif; font-size: 20px; fill: #111111; text-anchor: middle; dominant-baseline: middle; }
      .arrow { stroke: #111111; stroke-width: 2.5; fill: none; marker-end: url(#arrowhead); }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto">
      <polygon points="0,0 10,4 0,8" fill="#111111" />
    </marker>
  </defs>

  <rect x="390" y="40" width="420" height="72" rx="10" class="box"/>
  <text x="600" y="76" class="text">Пользовательский ввод</text>

  <line x1="600" y1="112" x2="600" y2="156" class="arrow"/>

  <rect x="390" y="156" width="420" height="72" rx="10" class="box"/>
  <text x="600" y="192" class="text">Добавление контекста</text>

  <line x1="600" y1="228" x2="600" y2="272" class="arrow"/>

  <rect x="390" y="272" width="420" height="72" rx="10" class="box"/>
  <text x="600" y="308" class="text">Выбор режима интерпретации</text>

  <line x1="600" y1="344" x2="600" y2="388" class="arrow"/>

  <rect x="390" y="388" width="420" height="72" rx="10" class="box"/>
  <text x="600" y="424" class="small">Формирование структурированной команды</text>

  <line x1="600" y1="460" x2="600" y2="504" class="arrow"/>

  <rect x="390" y="504" width="420" height="72" rx="10" class="box"/>
  <text x="600" y="540" class="text">Валидация</text>

  <line x1="600" y1="576" x2="600" y2="620" class="arrow"/>

  <rect x="390" y="620" width="420" height="72" rx="10" class="box"/>
  <text x="600" y="656" class="text">План исполнения</text>

  <line x1="810" y1="540" x2="980" y2="540" class="arrow"/>
  <rect x="980" y="504" width="170" height="72" rx="10" class="box"/>
  <text x="1065" y="532" class="small">Запрос</text>
  <text x="1065" y="558" class="small">уточнения</text>

  <line x1="600" y1="692" x2="600" y2="724" class="arrow"/>
  <text x="600" y="744" class="small">Передача в исполнительную среду</text>
</svg>
