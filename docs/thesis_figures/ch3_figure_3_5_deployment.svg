<svg xmlns="http://www.w3.org/2000/svg" width="1480" height="800" viewBox="0 0 1480 800">
  <defs>
    <style>
      .label { font: 600 22px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .small { font: 400 17px 'Segoe UI', Arial, sans-serif; fill: #111; }
      .box { fill: #fff; stroke: #111; stroke-width: 2.5; rx: 18; ry: 18; }
      .line { stroke: #111; stroke-width: 2.5; fill: none; marker-end: url(#arrow); }
      .zone { fill: #fff; stroke: #111; stroke-width: 2; stroke-dasharray: 10 8; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#111"/>
    </marker>
  </defs>
  <rect x="20" y="20" width="1440" height="760" fill="#fff" stroke="#111" stroke-width="2"/>

  <rect class="zone" x="60" y="80" width="1340" height="640"/>
  <rect x="92" y="88" width="360" height="32" fill="#fff"/>
  <text x="120" y="112" class="label">Локальная сеть / вычислительный контур</text>

  <rect class="box" x="110" y="240" width="230" height="140"/>
  <text x="225" y="290" text-anchor="middle" class="label">Android-приложение</text>
  <text x="225" y="325" text-anchor="middle" class="small">gateway URL</text>
  <text x="225" y="352" text-anchor="middle" class="small">API-key</text>

  <rect class="box" x="460" y="210" width="280" height="200"/>
  <text x="600" y="260" text-anchor="middle" class="label">Gateway / FastAPI</text>
  <text x="600" y="295" text-anchor="middle" class="small">команды, сценарии, журнал</text>
  <text x="600" y="325" text-anchor="middle" class="small">GATEWAY_API_KEY</text>
  <text x="600" y="355" text-anchor="middle" class="small">GATEWAY_LOG_DIR</text>

  <rect class="box" x="860" y="110" width="260" height="160"/>
  <text x="990" y="160" text-anchor="middle" class="label">Локальный LLM-мост</text>
  <text x="990" y="195" text-anchor="middle" class="small">LLM_BASE_URL</text>
  <text x="990" y="222" text-anchor="middle" class="small">LLM_MODEL</text>

  <rect class="box" x="860" y="390" width="260" height="190"/>
  <text x="990" y="440" text-anchor="middle" class="label">Home Assistant</text>
  <text x="990" y="475" text-anchor="middle" class="small">HA_URL / HA_TOKEN</text>
  <text x="990" y="502" text-anchor="middle" class="small">или Supervisor API</text>
  <text x="990" y="529" text-anchor="middle" class="small">в режиме add-on</text>

  <rect class="box" x="1230" y="390" width="140" height="190"/>
  <text x="1300" y="460" text-anchor="middle" class="label">IoT</text>
  <text x="1300" y="495" text-anchor="middle" class="small">лампы</text>
  <text x="1300" y="522" text-anchor="middle" class="small">розетки</text>
  <text x="1300" y="549" text-anchor="middle" class="small">датчики</text>

  <line class="line" x1="340" y1="310" x2="460" y2="310"/>
  <line class="line" x1="740" y1="270" x2="860" y2="190"/>
  <line class="line" x1="740" y1="350" x2="860" y2="480"/>
  <line class="line" x1="1120" y1="485" x2="1230" y2="485"/>

  <rect x="356" y="270" width="150" height="24" fill="#fff"/>
  <text x="431" y="288" text-anchor="middle" class="small">HTTP + X-API-Key</text>
  <rect x="742" y="158" width="176" height="24" fill="#fff"/>
  <text x="830" y="176" text-anchor="middle" class="small">OpenAI-compatible API</text>
  <rect x="692" y="455" width="190" height="24" fill="#fff"/>
  <text x="787" y="473" text-anchor="middle" class="small">REST API / Supervisor API</text>
</svg>
